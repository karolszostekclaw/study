<style>
/* Layout: one-screen app. Full-height snap feed of chalkboard/whiteboard cards, tab bar at the bottom. */
:root {
  --bg: #eef1ef;
  --surface: #fbfcfb;
  --ink: #17201c;
  --muted: #56645d;
  --line: #d3dbd6;
  --accent: #2a55c9;
  --accent-ink: #ffffff;
  --good: #1b7449;
  --bad: #b3372f;
  --t-la: #2a55c9; --t-ca: #b8561c; --t-pr: #1b7449; --t-op: #7440bd; --t-ml: #0e7580;
  --t-it: #96700f; --t-dl: #b92f58; --t-ph: #2a73a8; --t-fi: #66631a;
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131b18; --surface: #1a2420; --ink: #e5eae3; --muted: #9ba89f; --line: #2b3933;
    --accent: #e8cd6b; --accent-ink: #1d1b0e; --good: #72cf98; --bad: #f08b7f;
    --t-la: #93b1ff; --t-ca: #f1a56f; --t-pr: #7fd3a2; --t-op: #c6a6f3; --t-ml: #6fcfd7;
    --t-it: #e3c46b; --t-dl: #f08cab; --t-ph: #8ac4ec; --t-fi: #d0cc72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131b18; --surface: #1a2420; --ink: #e5eae3; --muted: #9ba89f; --line: #2b3933;
  --accent: #e8cd6b; --accent-ink: #1d1b0e; --good: #72cf98; --bad: #f08b7f;
  --t-la: #93b1ff; --t-ca: #f1a56f; --t-pr: #7fd3a2; --t-op: #c6a6f3; --t-ml: #6fcfd7;
  --t-it: #e3c46b; --t-dl: #f08cab; --t-ph: #8ac4ec; --t-fi: #d0cc72;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px;
  display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; letter-spacing: .01em; }
.brand i { font-style: italic; font-weight: 400; color: var(--muted); }
.pulse { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.pulse b { color: var(--ink); font-weight: 500; }

main { position: relative; min-height: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; }

/* feed */
.feed { scroll-snap-type: y mandatory; overscroll-behavior-y: contain; }
.slide { min-height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; border-bottom: 1px solid var(--line); }
.card { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; width: 100%; max-width: 40rem; margin-inline: auto; padding: 28px 20px 16px; min-width: 0; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tc, var(--accent)); flex: none; }
.eyebrow .kind { color: var(--tc, var(--accent)); }
.title { font-family: var(--f-display); font-weight: 600; font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.prose { font-family: var(--f-display); font-size: 1.04rem; line-height: 1.6; min-width: 0; }
.prose p { margin: 0 0 .7em; }
.prose p:last-child { margin-bottom: 0; }
.prose ul, .prose ol { margin: 0 0 .7em; padding-left: 1.2em; display: grid; gap: .3em; }
.prose code { font-family: var(--f-mono); font-size: .88em; }
.prose strong { font-weight: 600; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-block: 2px; margin: .6em 0 !important; }
mjx-container { color: inherit; }
.prose mjx-container:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
.src { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); margin: 0; }
.src::before { content: "Source · "; }

.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-family: var(--f-display); font-size: 1rem; }
.opt[aria-pressed="true"].right { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.opt[aria-pressed="true"].wrong { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.opt.reveal-right { border-color: var(--good); }
.reveal { border-left: 2px solid var(--tc, var(--accent)); padding: 2px 0 2px 14px; }
.reveal .lbl { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .86rem; font-weight: 500; }
.chip.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.actions { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 40rem; width: 100%; margin-inline: auto; padding: 6px 8px 10px; }
.act { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 10px; font-size: .7rem; color: var(--muted); }
.act svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.act[aria-pressed="true"] { color: var(--accent); }
.act.good[aria-pressed="true"] { color: var(--good); }
.act.again[aria-pressed="true"] { color: var(--bad); }
.hintline { text-align: center; font-family: var(--f-mono); font-size: .68rem; color: var(--muted); letter-spacing: .06em; padding-bottom: 6px; }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); background: var(--bg); }
.tab { padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .74rem; color: var(--muted); }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; }

/* pages (study) */
.page { max-width: 40rem; margin-inline: auto; padding: 20px 16px 32px; display: grid; gap: 18px; }
.h { font-family: var(--f-display); font-weight: 600; font-size: 1.35rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; line-height: 1.5; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--f-display); font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; color: var(--muted); }
.track { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.track:first-child { border-top: 0; padding-top: 0; }
.track .name { font-weight: 600; min-width: 0; }
.track .meta { font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { grid-column: 2 / 4; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--tc); }
.bar i.seen { opacity: .35; }
.track .btns { display: flex; gap: 6px; }
.small { padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); font-size: .8rem; font-weight: 500; background: var(--bg); }
.switch { display: flex; align-items: center; gap: 8px; font-size: .86rem; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
.back { justify-self: start; }
.readcard { display: grid; gap: 12px; padding: 18px 0; border-top: 1px solid var(--line); }
.readcard:first-of-type { border-top: 0; }
.readcard .title { font-size: 1.3rem; }
.saved-item { text-align: left; padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.saved-item:first-child { border-top: 0; }
.note { font-size: .8rem; color: var(--muted); line-height: 1.5; margin: 0; }

/* exam */
.examhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 2; }
.timer { font-family: var(--f-mono); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.q { display: grid; gap: 10px; padding: 16px 0; border-top: 1px solid var(--line); }
.qn { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); letter-spacing: .06em; }
.mark { display: flex; gap: 8px; align-items: center; font-size: .86rem; }
.mark .small[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.score { font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; }

/* ask sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88%; display: flex; flex-direction: column; background: var(--surface); border-top-left-radius: 18px; border-top-right-radius: 18px; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-in { width: 100%; max-width: 40rem; margin-inline: auto; display: flex; flex-direction: column; min-height: 0; flex: 1; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 8px; }
.sheet-head .t { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; flex: none; }
.seg button { padding: 5px 11px; border-radius: 999px; font-size: .78rem; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.msgs { flex: 1; overflow-y: auto; padding: 4px 16px 10px; display: grid; gap: 12px; align-content: start; min-height: 6rem; }
.msg { min-width: 0; }
.msg.me { justify-self: end; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; max-width: 85%; font-size: .92rem; }
.msg.ai { font-family: var(--f-display); line-height: 1.55; }
.msg.ai.pending { color: var(--muted); font-family: var(--f-mono); font-size: .76rem; }
.compose { display: grid; gap: 8px; padding: 8px 16px 12px; border-top: 1px solid var(--line); }
.compose-row { display: flex; gap: 8px; align-items: end; }
textarea { flex: 1; min-width: 0; resize: none; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); max-height: 7rem; }
.send { padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 600; }
.send:disabled { opacity: .45; }
.photo { font-size: .8rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }

@media (prefers-reduced-motion: no-preference) {
  .feed { scroll-behavior: smooth; }
  .sheet { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (min-width: 720px) {
  .title { font-size: 1.9rem; }
  .prose { font-size: 1.1rem; }
}
</style>

<script>
Bridge.start(() => {
'use strict';

/* ---------- deck ---------- */
const TRACKS = {
  la: 'Linear algebra', ca: 'Calculus & analysis', pr: 'Probability & statistics',
  op: 'Optimisation', ml: 'Machine learning', it: 'Information theory',
  dl: 'Deep learning', ph: 'Physics', fi: 'Economics & finance'
};
const KINDS = { def: 'Definition', thm: 'Theorem', formula: 'Formula', intuition: 'Intuition', check: 'Quick check', problem: 'Problem', why: 'Why it matters' };

function parseDeck(txt) {
  const out = [];
  for (const chunk of txt.split(/^=== /m).slice(1)) {
    const lines = chunk.split('\n');
    const [id, track, kind, title, src] = lines[0].split('|').map(s => s.trim());
    const card = { id, track, kind, title, src };
    let key = null, buf = [];
    const flush = () => { if (key) card[key] = buf.join('\n').trim(); };
    for (const line of lines.slice(1)) {
      if (line.startsWith('#')) continue;
      const m = line.match(/^(body|say|hint|sol|opts|ans|why):\s?(.*)$/);
      if (m) { flush(); key = m[1]; buf = [m[2]]; } else buf.push(line);
    }
    flush();
    if (card.opts) card.opts = card.opts.split(' || ').map(s => s.trim());
    if (card.ans !== undefined) card.ans = +card.ans;
    out.push(card);
  }
  return out;
}
const DECK = parseDeck(Bridge.content.deck);
const BY_ID = Object.fromEntries(DECK.map(c => [c.id, c]));
const TRACK_IDS = Object.keys(TRACKS).filter(t => DECK.some(c => c.track === t));

/* ---------- tiny markdown with maths kept intact ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function md(src) {
  const math = [];
  let s = src.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => { math.push(m); return '\u0000' + (math.length - 1) + '\u0000'; });
  s = esc(s);
  const inline = t => t
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  const html = s.split(/\n\s*\n/).map(block => {
    const lines = block.split('\n').filter(l => l.trim() !== '');
    if (!lines.length) return '';
    if (lines.every(l => /^\s*[-*] /.test(l))) return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*] /, '')) + '</li>').join('') + '</ul>';
    if (lines.every(l => /^\s*\d+[.)] /.test(l))) return '<ol>' + lines.map(l => '<li>' + inline(l.replace(/^\s*\d+[.)] /, '')) + '</li>').join('') + '</ol>';
    const first = lines.findIndex(l => /^\s*[-*] /.test(l));
    if (first > 0 && lines.slice(first).every(l => /^\s*[-*] /.test(l))) {
      return '<p>' + inline(lines.slice(0, first).join('<br>')) + '</p><ul>' + lines.slice(first).map(l => '<li>' + inline(l.replace(/^\s*[-*] /, '')) + '</li>').join('') + '</ul>';
    }
    return '<p>' + inline(lines.join('<br>')) + '</p>';
  }).join('');
  return html.replace(/\u0000(\d+)\u0000/g, (_, i) => esc(math[+i]));
}
async function typeset(el) {
  await mathReady;
  try { await MathJax.typesetPromise([el]); } catch (e) { /* leave source visible */ }
}

/* ---------- state: this device first, synced to the account when available ---------- */
const DAY = 864e5;
const INTERVALS = [0, 1, 3, 7, 16, 35, 90];
const LS_KEY = 'lemma-feed-v1';
let state = { p: {}, saved: {}, days: {}, exams: [], tracks: null, voice: '', rate: 1, pause: 5, updatedAt: 0 };
try { const raw = localStorage.getItem(LS_KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
let dbRef = null, syncLabel = 'Saved on this device', saveTimer = null, interacted = false;
function save() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    dbRef.set({ json: JSON.stringify(state), updatedAt: state.updatedAt })
      .then(() => { syncLabel = 'Synced to your private repo'; })
      .catch(() => { syncLabel = 'Saved on this device (sync failed)'; });
  }, 1500);
}
const today = () => new Date().toISOString().slice(0, 10);
function streak() {
  let n = 0; const d = new Date();
  if (!state.days[today()]) d.setDate(d.getDate() - 1);
  while (state.days[d.toISOString().slice(0, 10)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const enabledTracks = () => (state.tracks && state.tracks.length ? state.tracks : TRACK_IDS);
function renderPulse() {
  const s = streak();
  document.getElementById('pulse').innerHTML = `<b>${state.days[today()] || 0}</b> today · <b>${s}</b>-day streak`;
}
function markSeen(id) {
  const now = Date.now();
  const p = state.p[id];
  if (!p) state.p[id] = { b: 0, d: now + DAY, s: 1, l: now };
  else { p.s++; p.l = now; }
  state.days[today()] = (state.days[today()] || 0) + 1;
  save(); renderPulse();
}
function rate(id, good) {
  const now = Date.now();
  const p = state.p[id] || (state.p[id] = { b: 0, d: now, s: 1, l: now });
  if (good) { p.b = Math.min((p.b || 0) + 1, INTERVALS.length - 1); p.d = now + INTERVALS[p.b] * DAY; }
  else { p.b = 0; p.d = now + 10 * 60e3; }
  interacted = true;
  save();
}

/* ---------- what comes next: new cards round-robin across topics, reviews every 4th ---------- */
class Picker {
  constructor() { this.shown = new Set(); this.ptr = {}; this.turn = 0; this.n = 0; }
  next() {
    const now = Date.now();
    const tracks = enabledTracks();
    const pool = DECK.filter(c => tracks.includes(c.track));
    if (!pool.length) return null;
    if (pool.every(c => this.shown.has(c.id))) this.shown.clear();
    const due = pool.filter(c => state.p[c.id] && state.p[c.id].d <= now && !this.shown.has(c.id)).sort((a, b) => state.p[a.id].d - state.p[b.id].d);
    const fresh = () => {
      for (let i = 0; i < tracks.length; i++) {
        const t = tracks[(this.turn + i) % tracks.length];
        const c = pool.find(c => c.track === t && !state.p[c.id] && !this.shown.has(c.id));
        if (c) { this.turn = (this.turn + i + 1) % tracks.length; return c; }
      }
      return null;
    };
    this.n++;
    let c = (this.n % 4 === 0 && due[0]) || fresh() || due[0];
    if (!c) c = pool.filter(c => !this.shown.has(c.id)).sort((a, b) => ((state.p[a.id] || {}).l || 0) - ((state.p[b.id] || {}).l || 0))[0];
    this.shown.add(c.id);
    return c;
  }
}

  text = (text || '').trim();
  if (!text || ask.busy) return;
  const s = await getSample();
  if (!s) { addMsg('ai pending', 'Add your Anthropic API key in Settings to ask Claude.'); return; }
  const c = ask.card;
  addMsg('me', esc(text).replace(/\n/g, '<br>'));
  input.value = '';
  const content = ask.turns.length ? `${text}\n\n(${ask.mode === 'tutor' ? 'Keep tutoring: hints and questions, not the answer.' : 'Keep explaining clearly.'})` : `${contextPrompt(c)}\n\nLearner's question: ${text}`;
  ask.turns.push({ role: 'user', content });
  const out = addMsg('ai pending', 'Thinking…');
  const opts = { onText: ({ text }) => { out.className = 'msg ai'; out.innerHTML = md(text); msgsEl.scrollTop = msgsEl.scrollHeight; }, cache: false };
  if (photo.files && photo.files[0]) opts.images = photo.files[0];
  ask.ctrl = new AbortController(); opts.signal = ask.ctrl.signal;
  ask.busy = true; document.getElementById('ask-send').disabled = true;
  try {
    const r = await s(ask.turns, opts);
    out.className = 'msg ai'; out.innerHTML = md(r.text) + (r.truncated ? '<p class="note">The answer was cut short. Ask it to continue.</p>' : '');
    ask.turns.push({ role: 'assistant', content: r.text });
    photo.value = '';
    typeset(out);
  } catch (e) {
    ask.turns.pop();
    const copy = {
      cancelled: 'Stopped.', not_granted: 'Your Anthropic API key was rejected. Check it in Settings.', no_key: 'Add your Anthropic API key in Settings.',
      offline: 'You are offline. Ask again when you are back online.', network: 'Could not reach Claude. Check your connection and ask again.',
      rate_limited: 'Too many questions in a short time. Wait a minute, then ask again.',
      api_error: 'Claude returned an error. Ask again in a moment.',
      prompt_too_large: 'That question is too long. Shorten it and ask again.',
      image_rejected: 'That photo could not be used. Try a smaller JPEG or PNG.', refused: 'Claude declined to answer that one.'
    };
    const keep = e && e.text ? md(e.text) : '';
    out.className = 'msg ai'; out.innerHTML = keep + `<p class="note">${esc(copy[e && e.code] || 'The answer did not come through. Ask again.')}</p>`;
    if (keep) typeset(out);
  } finally {
    ask.busy = false; ask.ctrl = null; document.getElementById('ask-send').disabled = false;
  }
}
document.getElementById('ask-form').addEventListener('submit', e => { e.preventDefault(); send(input.value); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); } });

/* ---------- tabs ---------- */
let feedDirty = false;
function show(view) {
  for (const v of ['feed', 'study']) {
    document.getElementById('view-' + v).hidden = v !== view;
    document.getElementById('tab-' + v).setAttribute('aria-selected', String(v === view));
  }
  if (view === 'study') buildStudy();
  if (view === 'feed' && feedDirty) { feedDirty = false; rebuildFeed(); }
}
window.__show = show;
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) show(b.dataset.view); });
feed.addEventListener('scroll', () => { interacted = true; }, { once: true, passive: true });

/* ---------- start ---------- */
renderPulse();
rebuildFeed();
const hash = (location.hash || '').slice(1);
if (hash === 'study') show(hash);

const canon = o => JSON.stringify(o, (k, v) => k === 'updatedAt' ? undefined : (v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((r, x) => (r[x] = v[x], r), {}) : v));
function mergeProgress(a, b) {
  const out = Object.assign({}, b, a);
  const newer = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
  ['tracks', 'voice', 'rate', 'pause'].forEach(k => { if (k in newer) out[k] = newer[k]; });
  out.p = Object.assign({}, b.p || {});
  for (const [id, v] of Object.entries(a.p || {})) {
    const r = out.p[id];
    if (!r || (v.l || 0) >= (r.l || 0)) out.p[id] = r ? Object.assign({}, v, { s: Math.max(v.s || 0, r.s || 0) }) : v;
    else out.p[id] = Object.assign({}, r, { s: Math.max(v.s || 0, r.s || 0) });
  }
  out.saved = Object.assign({}, b.saved || {}, a.saved || {});
  out.days = Object.assign({}, b.days || {});
  for (const [day, n] of Object.entries(a.days || {})) out.days[day] = Math.max(n, out.days[day] || 0);
  const seen = new Set(); out.exams = [];
  [...(b.exams || []), ...(a.exams || [])].sort((x, y) => (x.at || 0) - (y.at || 0)).forEach(e => { const k = e.at + '|' + e.name; if (!seen.has(k)) { seen.add(k); out.exams.push(e); } });
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return out;
}
(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.collection('data/users/' + uid).doc('progress');
    const snap = await ref.get();
    if (snap.exists) {
      const d = snap.data() || {};
      const remote = d.json ? JSON.parse(d.json) : null;
      if (remote) {
        // Merge card by card instead of letting the newer copy win: cards seen on this
        // device before the repo copy arrived must not wipe older progress, or the reverse.
        const before = JSON.stringify(state);
        state = mergeProgress(state, remote);
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
        if (JSON.stringify(state) !== before) {
          renderPulse();
          if (!interacted) rebuildFeed();
          if (!document.getElementById('view-study').hidden) buildStudy();
        }
        dbRef = ref; syncLabel = 'Synced to your private repo';
        if (canon(remote) !== canon(state)) save();
        return;
      }
    }
    dbRef = ref; syncLabel = 'Synced to your private repo';
    save();
  } catch (e) { syncLabel = 'Saved on this device'; }
})();
});
</script>
